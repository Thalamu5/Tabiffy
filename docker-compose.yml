# app: web app + API on http://localhost:8000
# worker: processes uploads in the background (note detection, beats, fingering)
# redis: the job queue between them
services:
  app:
    build: .
    ports:
      # Only reachable from this computer. To open it to other devices on your network, use "8000:8000".
      - "127.0.0.1:8000:8000"
    environment:
      TABIFFY_REDIS_URL: redis://redis:6379/0
    volumes:
      - tabiffy-data:/data
    depends_on:
      - redis
    restart: unless-stopped

  worker:
    build: .
    command: ["rq", "worker", "tabiffy", "--url", "redis://redis:6379/0"]
    environment:
      TABIFFY_REDIS_URL: redis://redis:6379/0
    volumes:
      - tabiffy-data:/data
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped

volumes:
  tabiffy-data:
