# app: web app + API on http://localhost:8000
# worker: runs uploads in the background (instrument separation + transcription)
# redis: the job queue between them
services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      TABIFFY_REDIS_URL: redis://redis:6379/0
    volumes:
      - tabiffy-data:/data
    depends_on:
      - redis
    restart: unless-stopped

  worker:
    build: .
    command: ["rq", "worker", "tabiffy", "--url", "redis://redis:6379/0"]
    environment:
      TABIFFY_REDIS_URL: redis://redis:6379/0
    volumes:
      - tabiffy-data:/data
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped

volumes:
  tabiffy-data:
